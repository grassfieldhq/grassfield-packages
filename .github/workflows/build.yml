# Build one Grassfield tag (or commit) once: its release build for each channel it goes to and a channel tree made from
# them, as a CI artifact (grassfield ADR-0033 e-h; ADR-0037 g). The build and test jobs sign with a throwaway key made in
# the job (ADR-0033 b.7): their artifact is for review and tests only, never for clients. The release job (enabled by the
# owner's decision of 2026-11-04, for a tag run from main) signs a tag's tested release builds with the project's key,
# after the owner's approval of the channel's environment, and keeps them where the channel's one serialized publisher
# reads them (ADR-0037 g; publish.yml, which starts when this workflow completes). The tag poll stays off
# (GRASSFIELD_TAG_POLL, poll.yml): the owner starts this workflow by hand.
#
# Set by the owner: the secret GRASSFIELD_DEPLOY_KEY, a read-only deploy key of grassfieldhq/grassfield (O13), without which
# the build stops at its first step; for the release job, the publisher's protected environments publish-stable and
# publish-beta (the owner approves each run) with the secrets GRASSFIELD_SIGNING_KEY (armored secret key),
# GRASSFIELD_SIGNING_PASSPHRASE (O6), GRASSFIELD_S3_ACCESS_KEY_ID, GRASSFIELD_S3_SECRET_ACCESS_KEY and the variables
# GRASSFIELD_S3_BUCKET, GRASSFIELD_S3_ENDPOINT (O8).
name: build
run-name: build ${{ inputs.ref }}${{ inputs.pkgrel && format(' pkgrel {0}', inputs.pkgrel) || '' }}
on:
  workflow_dispatch:
    inputs:
      ref:
        description: grassfield tag (vX.Y.Z, vX.Y.Z-betaN, vX.Y.Z-rcN) or commit
        required: true
      pkgrel:
        description: a rebuild of the tag for a new Hyprland (ADR-0033 f, O7), the pkgrel above the published one; empty otherwise
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: build-${{ inputs.ref }}-${{ inputs.pkgrel }}
env:
  IMAGE: archlinux:base@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    # actions: read lets a run of main ask which ref saved a cache it restored (the guard step); nothing here writes.
    permissions:
      contents: read
      actions: read
    steps:
      - name: The deploy key exists
        env:
          DEPLOY_KEY: ${{ secrets.GRASSFIELD_DEPLOY_KEY }}
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "::error::GRASSFIELD_DEPLOY_KEY is not set (owner decision O13): nothing to build"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: packages
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: grassfieldhq/grassfield
          ssh-key: ${{ secrets.GRASSFIELD_DEPLOY_KEY }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
          path: grassfield
      # Caches (docs/build-caches.md). Scope: a cache is visible to the ref that saved it and to runs of the default branch's
      # saves only (GitHub's rule: a branch reads its own and main's, never a sibling's or a pull request's; a tag or a
      # main run reads main's). Key names carry the scope as well ("main" or "dev"), and a run of main checks, through the
      # API, that what it restored was saved by main.
      - name: Which caches this run may use
        id: mode
        env:
          REF_INPUT: ${{ inputs.ref }}
          RELEASE_CACHE: ${{ vars.GRASSFIELD_RELEASE_CACHE }}
        run: |
          set -euo pipefail
          digest=${IMAGE##*sha256:}; digest=${digest:0:16}
          scope=dev; [ "$GITHUB_REF" = refs/heads/main ] && scope=main
          # What the release job would sign is built by a run of main for a tag: that build uses no ccache and no data cache
          # unless the owner opts in (GRASSFIELD_RELEASE_CACHE=on). The pacman cache is verified by pacman: always on.
          release_bound=false
          [ "$scope" = main ] && [[ $REF_INPUT == v* ]] && release_bound=true
          build_cache=true
          [ "$release_bound" = true ] && [ "$RELEASE_CACHE" != on ] && build_cache=false
          # main's caches are written by release-bound builds only (a main run of a commit reads them, never writes).
          save_build_cache=$build_cache
          [ "$scope" = main ] && [ "$release_bound" = false ] && save_build_cache=false
          {
            echo "digest=$digest"; echo "scope=$scope"; echo "release_bound=$release_bound"
            echo "build_cache=$build_cache"; echo "save_build_cache=$save_build_cache"
          } >>"$GITHUB_OUTPUT"
          echo "scope $scope, release-bound $release_bound, ccache and data cache $build_cache (saved: $save_build_cache)"
          mkdir -p cache/pacman cache/ccache cache/data
      - name: Restore the pacman cache
        id: pacman-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: cache/pacman
          key: pacman-${{ steps.mode.outputs.scope }}-${{ steps.mode.outputs.digest }}-${{ hashFiles('packages/build/pacman.conf', 'packages/scripts/build-channel.sh', 'grassfield/packaging/arch/PKGBUILD') }}
          restore-keys: |
            pacman-${{ steps.mode.outputs.scope }}-${{ steps.mode.outputs.digest }}-
            pacman-main-${{ steps.mode.outputs.digest }}-
      - name: Restore the ccache folder
        id: ccache
        if: steps.mode.outputs.build_cache == 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: cache/ccache
          key: ccache-${{ steps.mode.outputs.scope }}-${{ steps.mode.outputs.digest }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ steps.mode.outputs.scope }}-${{ steps.mode.outputs.digest }}-
            ccache-main-${{ steps.mode.outputs.digest }}-
      - name: Restore the data products (composed icons and shrunk photographs, keyed by their inputs)
        id: data
        if: steps.mode.outputs.build_cache == 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: cache/data
          key: data-${{ steps.mode.outputs.scope }}-${{ steps.mode.outputs.digest }}-${{ hashFiles('grassfield/packaging/arch/icon*', 'grassfield/packaging/arch/wallpaper*', 'grassfield/branding/icons/theme/**', 'grassfield/branding/cursors/**', 'grassfield/packaging/plymouth/**', 'grassfield/apps/wallpaper-tool/**') }}
          restore-keys: |
            data-main-${{ steps.mode.outputs.digest }}-${{ hashFiles('grassfield/packaging/arch/icon*', 'grassfield/packaging/arch/wallpaper*', 'grassfield/branding/icons/theme/**', 'grassfield/branding/cursors/**', 'grassfield/packaging/plymouth/**', 'grassfield/apps/wallpaper-tool/**') }}
      - name: A run of main restored only what main saved
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE: ${{ steps.mode.outputs.scope }}
          MATCHED: ${{ steps.pacman-cache.outputs.cache-matched-key }} ${{ steps.ccache.outputs.cache-matched-key }} ${{ steps.data.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          for k in $MATCHED; do
            [[ $k == *-main-* ]] || { echo "::error::restored '$k': not a key of main's scope"; exit 1; }
            n=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/caches" -f key="$k" -f ref=refs/heads/main -f per_page=100 |
              jq --arg k "$k" '[.actions_caches[] | select(.key == $k and .ref == "refs/heads/main")] | length')
            [ "$n" -ge 1 ] || { echo "::error::restored '$k': no cache of that name was saved by a run of main"; exit 1; }
            echo "restored '$k': saved by main"
          done
      - name: Build in a throwaway Arch container with Omarchy stable's package set, signed by a throwaway key
        env:
          REF: ${{ inputs.ref }}
          PKGREL: ${{ inputs.pkgrel }}
          BUILD_CACHE: ${{ steps.mode.outputs.build_cache }}
        run: |
          mkdir -p out
          before=$(ls -1 cache/pacman | sha256sum | cut -d' ' -f1)
          echo "PACMAN_BEFORE=$before" >>"$GITHUB_ENV"
          cache_args=(-v "$PWD/cache/pacman:/var/cache/pacman/pkg" -e GRASSFIELD_PACMAN_CACHE_PRUNE=1)
          if [ "$BUILD_CACHE" = true ]; then
            cache_args+=(-v "$PWD/cache/ccache:/cache/ccache" -e GRASSFIELD_CCACHE_DIR=/cache/ccache
              -v "$PWD/cache/data:/cache/data" -e GRASSFIELD_DATA_CACHE=/cache/data)
          fi
          docker run --rm -e REF -e PKGREL "${cache_args[@]}" -v "$PWD/packages:/packages:ro" -v "$PWD/grassfield:/grassfield:ro" -v "$PWD/out:/out" \
            "$IMAGE" bash -euo pipefail -c '
              trap "mkdir -p /out/build-stats; cp -r /build/stats/. /out/build-stats/ 2>/dev/null; cp /build/build.log /out/build.log 2>/dev/null || true" EXIT
              export GNUPGHOME=$(mktemp -d)
              gpg --batch --pinentry-mode loopback --passphrase "" \
                --quick-gen-key "Grassfield CI build (throwaway) <ci@grassfield.invalid>" ed25519 sign 14d 2>/dev/null
              key=$(gpg --with-colons --list-keys | awk -F: "\$1==\"fpr\" {print \$10; exit}")
              /packages/scripts/build-channel.sh --source /grassfield --ref "$REF" --tree /out/tree \
                --gnupghome "$GNUPGHOME" --key "$key" ${PKGREL:+--pkgrel "$PKGREL"}
              gpg --export "$key" >/out/build-signing-key.gpg
              /packages/scripts/check-tree.sh --tree /out/tree --keyring /out/build-signing-key.gpg'
      - name: Timing and cache statistics in the job summary
        if: always()
        env:
          MODE: scope ${{ steps.mode.outputs.scope }}, release-bound ${{ steps.mode.outputs.release_bound }}, ccache and data cache ${{ steps.mode.outputs.build_cache }}
          PACMAN_HIT: ${{ steps.pacman-cache.outputs.cache-matched-key != '' }}
          CCACHE_HIT: ${{ steps.ccache.outputs.cache-matched-key != '' }}
          DATA_HIT: ${{ steps.data.outputs.cache-hit }}
        run: |
          d=$RUNNER_TEMP/stats; rm -rf "$d"; mkdir -p "$d"
          cp -r out/build-stats/. "$d/" 2>/dev/null || true
          cp out/build.log "$d/" 2>/dev/null || true
          {
            echo "## Build: timing and caches"
            echo
            echo "$MODE. Restored: pacman $PACMAN_HIT, ccache $CCACHE_HIT, data (exact key) ${DATA_HIT:-false}."
            echo "Pacman cache $(du -sh cache/pacman | cut -f1), ccache folder $(du -sh cache/ccache | cut -f1), data $(du -sh cache/data | cut -f1)."
            echo
            packages/scripts/build-summary.sh "$d"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: The pacman cache changed
        id: pacman-after
        if: success()
        run: |
          after=$(ls -1 cache/pacman | sha256sum | cut -d' ' -f1)
          echo "listing=${after:0:16}" >>"$GITHUB_OUTPUT"
          [ "$after" != "$PACMAN_BEFORE" ] && echo "changed=true" >>"$GITHUB_OUTPUT" || echo "changed=false" >>"$GITHUB_OUTPUT"
      # Saves: pacman packages are verified by pacman wherever they come from; the other two are saved only where the mode
      # says (never by a run of main for a commit), under main's own key names when main saves.
      - name: Save the pacman cache
        if: success() && steps.pacman-after.outputs.changed == 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: cache/pacman
          key: pacman-${{ steps.mode.outputs.scope }}-${{ steps.mode.outputs.digest }}-${{ hashFiles('packages/build/pacman.conf', 'packages/scripts/build-channel.sh', 'grassfield/packaging/arch/PKGBUILD') }}-${{ steps.pacman-after.outputs.listing }}
      - name: Save the ccache folder
        if: success() && steps.mode.outputs.save_build_cache == 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: cache/ccache
          key: ccache-${{ steps.mode.outputs.scope }}-${{ steps.mode.outputs.digest }}-${{ github.run_id }}
      - name: Save the data products
        if: success() && steps.mode.outputs.save_build_cache == 'true' && steps.data.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: cache/data
          key: data-${{ steps.mode.outputs.scope }}-${{ steps.mode.outputs.digest }}-${{ hashFiles('grassfield/packaging/arch/icon*', 'grassfield/packaging/arch/wallpaper*', 'grassfield/branding/icons/theme/**', 'grassfield/branding/cursors/**', 'grassfield/packaging/plymouth/**', 'grassfield/apps/wallpaper-tool/**') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: grassfield-channel-${{ github.run_id }}
          path: out
          retention-days: 14

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: packages
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: grassfield-channel-${{ github.run_id }}
          path: out
      - name: A fresh Omarchy stable machine installs the built packages; the client answers
        run: |
          docker run --rm -v "$PWD/packages:/packages:ro" -v "$PWD/out:/out:ro" "$IMAGE" \
            bash /packages/tests/smoke.sh --tree /out/tree --keyring /out/build-signing-key.gpg

  release:
    # ENABLED (owner decision of 2026-11-04), for a tag of main's workflow only: a manual run of this workflow from another
    # branch builds and tests, and stops there (the environments also accept deployments from main only; this workflow has
    # no pull_request trigger, so the key never meets one).
    # It holds no build: it receives the tested artifact. Three containers, so that the key never meets anything that
    # reads package contents (review M1: repo-add evaluates .PKGINFO lines): prepare (no key: published packages,
    # keyring/ compared, repo-add), sign (the key, gpg only, on an allowlist of names, no network), check (no key: as a
    # client checks it, the folder's exact contents, the keyring byte for byte keyring/'s). Only then is it uploaded.
    if: github.ref == 'refs/heads/main' && startsWith(inputs.ref, 'v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The publisher's environments (publish.yml): protected, the owner approves each run; each holds that channel's key
    # and storage credentials.
    environment: publish-${{ matrix.channel }}
    env:
      # R2 does not take the newer default checksums of the AWS command line.
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      CHANNEL: ${{ matrix.channel }}
      BUCKET: ${{ vars.GRASSFIELD_S3_BUCKET }}
      ENDPOINT: ${{ vars.GRASSFIELD_S3_ENDPOINT }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: packages
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: grassfield-channel-${{ github.run_id }}
          path: out
      - name: This channel's release build, none stored yet (each tag is built once), and the published packages of its names
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GRASSFIELD_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GRASSFIELD_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # Exact keys (review minor 1): 0 present, 1 absent (404), any other answer stops the job.
          exists() {
            local err
            if err=$(aws --endpoint-url "$ENDPOINT" s3api head-object --bucket "$BUCKET" --key "$1" 2>&1 >/dev/null); then return 0; fi
            if grep -qE '\(404\)|Not Found' <<<"$err"; then return 1; fi
            echo "::error::$1: $err"; exit 1
          }
          rel=$(ls -d out/tree/releases/"$CHANNEL"/*/ 2>/dev/null | head -n 1) || true
          [ -n "$rel" ] || { echo "this tag does not go to $CHANNEL"; exit 0; }
          rel=${rel%/} v=$(basename "$rel")
          for k in "releases/$CHANNEL/$v/grassfield.db" "withdrawn/$CHANNEL/$v/grassfield.db"; do
            if exists "$k"; then echo "$k is stored already: a release build is never replaced"; exit 0; fi
          done
          echo "REL=$rel" >>"$GITHUB_ENV"
          # A package file name never changes content: one already published is used as it is (grassfield-keyring).
          mkdir published
          for f in "$rel"/*.pkg.tar.zst; do
            b=$(basename "$f")
            if exists "$CHANNEL/x86_64/$b"; then
              aws --endpoint-url "$ENDPOINT" s3 cp "s3://$BUCKET/$CHANNEL/x86_64/$b" published/
              aws --endpoint-url "$ENDPOINT" s3 cp "s3://$BUCKET/$CHANNEL/x86_64/$b.sig" published/
            fi
          done
      - name: Prepared without the key (the published packages, keyring/ compared, repo-add)
        if: env.REL != ''
        run: |
          docker run --rm --network none -v "$PWD/packages:/packages:ro" -v "$PWD/$REL:/release" \
            -v "$PWD/published:/published:ro" "$IMAGE" \
            /packages/scripts/sign-release.sh prepare --release /release --keyring /packages/keyring --published /published
      - name: Signed with the project's key (only this container sees it; gpg only, on an allowlist of names)
        if: env.REL != ''
        env:
          GRASSFIELD_SIGNING_KEY: ${{ secrets.GRASSFIELD_SIGNING_KEY }}
          GRASSFIELD_SIGNING_PASSPHRASE: ${{ secrets.GRASSFIELD_SIGNING_PASSPHRASE }}
        run: |
          docker run --rm --network none -e GRASSFIELD_SIGNING_KEY -e GRASSFIELD_SIGNING_PASSPHRASE \
            -v "$PWD/packages:/packages:ro" -v "$PWD/$REL:/release" "$IMAGE" bash -euo pipefail -c '
              export GNUPGHOME=$(mktemp -d)
              printf "%s" "$GRASSFIELD_SIGNING_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
                --import <(printf "%s\n" "$GRASSFIELD_SIGNING_KEY")
              key=$(gpg --with-colons --list-secret-keys | awk -F: "\$1==\"fpr\" {print \$10; exit}")
              /packages/scripts/sign-release.sh sign --release /release --gnupghome "$GNUPGHOME" --key "$key"'
      # Until grassfield-keyring holds the project's key (O11), this refuses every release build: nothing can be signed
      # for clients before the keyring that trusts the key.
      - name: Checked as a client checks it, without the key (signatures, exact contents, keyring/ byte for byte)
        if: env.REL != ''
        run: |
          docker run --rm -v "$PWD/packages:/packages:ro" -v "$PWD/$REL:/release:ro" "$IMAGE" bash -euo pipefail -c '
            install -m644 /packages/build/pacman.conf /etc/pacman.conf
            { pacman-key --init && pacman-key --populate archlinux && pacman -Syu --noconfirm --needed python; } >/dev/null
            mkdir -p "/tmp/t/releases/$0" && cp -r /release "/tmp/t/releases/$0/$(basename "$1")"
            /packages/scripts/check-tree.sh --tree /tmp/t --trusted --keyring-src /packages/keyring' "$CHANNEL" "$REL"
      - name: Kept beside the channels, never under a pointer, its database last (the publisher reads a complete one)
        if: env.REL != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GRASSFIELD_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GRASSFIELD_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          dest=s3://$BUCKET/releases/$CHANNEL/$(basename "$REL")
          # Release builds are the publisher's inputs, nothing links to them: never cached.
          aws --endpoint-url "$ENDPOINT" s3 cp --recursive --cache-control no-store --exclude 'grassfield.db' "$REL/" "$dest/"
          aws --endpoint-url "$ENDPOINT" s3 cp --cache-control no-store "$REL/grassfield.db" "$dest/grassfield.db"
