# Build one Grassfield tag (or commit) once: its release build for each channel it goes to and a channel tree made from
# them, as a CI artifact (grassfield ADR-0033 e-h; ADR-0037 g). NOTHING IS PUBLISHED: build and test sign with a throwaway
# key made in the job (ADR-0033 b.7), so the artifact is for review and tests only, never for clients; it carries the
# keyless grassfield-keyring (U23) until the owner's key exists. The release job, written and disabled until the owner
# decides after the M5 legal review (owner decision 2026-10-27), signs a tag's tested release builds with the project's key
# and keeps them where the channel's one serialized publisher reads them (ADR-0037 g; that publisher is Grassfield Store's
# step 1, and starts when this workflow completes).
#
# From the owner, later (none exists; the agent creates none): the secret GRASSFIELD_DEPLOY_KEY, a read-only deploy key of
# grassfieldhq/grassfield (O13), without which the build stops at its first step; for the release job, the protected
# environment `release` (the owner approves each run) with the secrets GRASSFIELD_SIGNING_KEY (armored secret key),
# GRASSFIELD_SIGNING_PASSPHRASE (O6), GRASSFIELD_S3_ACCESS_KEY_ID, GRASSFIELD_S3_SECRET_ACCESS_KEY and the variables
# GRASSFIELD_S3_BUCKET, GRASSFIELD_S3_ENDPOINT (O8).
name: build
run-name: build ${{ inputs.ref }}
on:
  workflow_dispatch:
    inputs:
      ref:
        description: grassfield tag (vX.Y.Z, vX.Y.Z-betaN, vX.Y.Z-rcN) or commit
        required: true
permissions:
  contents: read
concurrency:
  group: build-${{ inputs.ref }}
env:
  IMAGE: archlinux:base@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: The deploy key exists
        env:
          DEPLOY_KEY: ${{ secrets.GRASSFIELD_DEPLOY_KEY }}
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "::error::GRASSFIELD_DEPLOY_KEY is not set (owner decision O13): nothing to build"; exit 1; }
      - uses: actions/checkout@v4
        with:
          path: packages
      - uses: actions/checkout@v4
        with:
          repository: grassfieldhq/grassfield
          ssh-key: ${{ secrets.GRASSFIELD_DEPLOY_KEY }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
          path: grassfield
      - name: Build in a throwaway Arch container with Omarchy stable's package set, signed by a throwaway key
        env:
          REF: ${{ inputs.ref }}
        run: |
          mkdir -p out
          docker run --rm -e REF -v "$PWD/packages:/packages:ro" -v "$PWD/grassfield:/grassfield:ro" -v "$PWD/out:/out" \
            "$IMAGE" bash -euo pipefail -c '
              trap "cp /build/build.log /out/build.log 2>/dev/null || true" EXIT
              export GNUPGHOME=$(mktemp -d)
              gpg --batch --pinentry-mode loopback --passphrase "" \
                --quick-gen-key "Grassfield CI build (throwaway) <ci@grassfield.invalid>" ed25519 sign 14d 2>/dev/null
              key=$(gpg --with-colons --list-keys | awk -F: "\$1==\"fpr\" {print \$10; exit}")
              /packages/scripts/build-channel.sh --source /grassfield --ref "$REF" --tree /out/tree \
                --gnupghome "$GNUPGHOME" --key "$key"
              gpg --export "$key" >/out/build-signing-key.gpg
              /packages/scripts/check-tree.sh --tree /out/tree --keyring /out/build-signing-key.gpg'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grassfield-channel-${{ github.run_id }}
          path: out
          retention-days: 14

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: grassfield-channel-${{ github.run_id }}
          path: out
      - name: A fresh Omarchy stable machine installs the built packages; the client answers
        run: |
          docker run --rm -v "$PWD/packages:/packages:ro" -v "$PWD/out:/out:ro" "$IMAGE" \
            bash /packages/tests/smoke.sh --tree /out/tree --keyring /out/build-signing-key.gpg

  release:
    # DISABLED: the owner removes `if: false` once the environment `release` exists (tags only: startsWith(inputs.ref, 'v')).
    if: false
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.GRASSFIELD_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.GRASSFIELD_S3_SECRET_ACCESS_KEY }}
      BUCKET: ${{ vars.GRASSFIELD_S3_BUCKET }}
      ENDPOINT: ${{ vars.GRASSFIELD_S3_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: grassfield-channel-${{ github.run_id }}
          path: out
      - name: The tested release builds signed with the project's key, kept beside the channels (never under a pointer)
        env:
          GRASSFIELD_SIGNING_KEY: ${{ secrets.GRASSFIELD_SIGNING_KEY }}
          GRASSFIELD_SIGNING_PASSPHRASE: ${{ secrets.GRASSFIELD_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          for rel in out/tree/releases/*/*/; do
            rel=${rel%/} c=$(basename "$(dirname "$rel")") v=$(basename "$rel")
            # A package file name never changes content: one already published is used as it is (grassfield-keyring).
            rm -rf published && mkdir published
            for f in "$rel"/*.pkg.tar.zst; do
              b=$(basename "$f")
              aws --endpoint-url "$ENDPOINT" s3 cp "s3://$BUCKET/$c/x86_64/$b" published/ 2>/dev/null &&
                aws --endpoint-url "$ENDPOINT" s3 cp "s3://$BUCKET/$c/x86_64/$b.sig" published/ || rm -f "published/$b"
            done
            docker run --rm -e C="$c" -e V="$v" -e GRASSFIELD_SIGNING_KEY -e GRASSFIELD_SIGNING_PASSPHRASE \
              -v "$PWD/packages:/packages:ro" -v "$PWD/$rel:/release" -v "$PWD/published:/published:ro" "$IMAGE" \
              bash -euo pipefail -c '
                install -m644 /packages/build/pacman.conf /etc/pacman.conf
                { pacman-key --init && pacman-key --populate archlinux && pacman -Syu --noconfirm --needed python; } >/dev/null
                export GNUPGHOME=$(mktemp -d)
                printf "%s" "$GRASSFIELD_SIGNING_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
                  --import <(printf "%s\n" "$GRASSFIELD_SIGNING_KEY")
                key=$(gpg --with-colons --list-secret-keys | awk -F: "\$1==\"fpr\" {print \$10; exit}")
                /packages/scripts/sign-release.sh --release /release --gnupghome "$GNUPGHOME" --key "$key" --published /published
                gpg --export "$key" >/tmp/project.gpg
                mkdir -p "/tmp/t/releases/$C" && cp -r /release "/tmp/t/releases/$C/$V"
                /packages/scripts/check-tree.sh --tree /tmp/t --keyring /tmp/project.gpg'
            aws --endpoint-url "$ENDPOINT" s3 sync "$rel/" "s3://$BUCKET/releases/$c/$v/"
          done
