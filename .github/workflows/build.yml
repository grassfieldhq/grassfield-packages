# Build one Grassfield tag (or commit) into the [grassfield] channel tree, as a CI artifact (grassfield ADR-0033 e-h).
# NOTHING IS PUBLISHED: this workflow builds and tests only. Publication is publish.yml, the one serialized publisher per
# channel, written and disabled until the owner decides, after the M5 legal review (owner decision 2026-10-27). The build
# signs with a throwaway key made in the job (ADR-0033 b.7), so the artifact is for review and tests only, never for
# clients; it carries the keyless grassfield-keyring (U23) until the owner's key exists. A successful run of "build <tag>"
# is what publish.yml calls a release built for its channel.
#
# Secret the owner provides later (none exists; the agent creates none): GRASSFIELD_DEPLOY_KEY, a read-only deploy key of
# grassfieldhq/grassfield (O13); without it the build stops at its first step. publish.yml lists the others.
name: build
run-name: build ${{ inputs.ref }}
on:
  workflow_dispatch:
    inputs:
      ref:
        description: grassfield tag (vX.Y.Z, vX.Y.Z-betaN, vX.Y.Z-rcN) or commit
        required: true
permissions:
  contents: read
concurrency:
  group: build-${{ inputs.ref }}
env:
  IMAGE: archlinux:base@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: The deploy key exists
        env:
          DEPLOY_KEY: ${{ secrets.GRASSFIELD_DEPLOY_KEY }}
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "::error::GRASSFIELD_DEPLOY_KEY is not set (owner decision O13): nothing to build"; exit 1; }
      - uses: actions/checkout@v4
        with:
          path: packages
      - uses: actions/checkout@v4
        with:
          repository: grassfieldhq/grassfield
          ssh-key: ${{ secrets.GRASSFIELD_DEPLOY_KEY }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
          path: grassfield
      - name: Build in a throwaway Arch container with Omarchy stable's package set, signed by a throwaway key
        env:
          REF: ${{ inputs.ref }}
        run: |
          mkdir -p out
          docker run --rm -e REF -v "$PWD/packages:/packages:ro" -v "$PWD/grassfield:/grassfield:ro" -v "$PWD/out:/out" \
            "$IMAGE" bash -euo pipefail -c '
              trap "cp /build/build.log /out/build.log 2>/dev/null || true" EXIT
              export GNUPGHOME=$(mktemp -d)
              gpg --batch --pinentry-mode loopback --passphrase "" \
                --quick-gen-key "Grassfield CI build (throwaway) <ci@grassfield.invalid>" ed25519 sign 14d 2>/dev/null
              key=$(gpg --with-colons --list-keys | awk -F: "\$1==\"fpr\" {print \$10; exit}")
              /packages/scripts/build-channel.sh --source /grassfield --ref "$REF" --tree /out/tree \
                --gnupghome "$GNUPGHOME" --key "$key"
              gpg --export "$key" >/out/build-signing-key.gpg
              /packages/scripts/check-tree.sh --tree /out/tree --keyring /out/build-signing-key.gpg'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grassfield-channel-${{ github.run_id }}
          path: out
          retention-days: 14

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: grassfield-channel-${{ github.run_id }}
          path: out
      - name: A fresh Omarchy stable machine installs the built packages; the client answers
        run: |
          docker run --rm -v "$PWD/packages:/packages:ro" -v "$PWD/out:/out:ro" "$IMAGE" \
            bash /packages/tests/smoke.sh --tree /out/tree --keyring /out/build-signing-key.gpg
