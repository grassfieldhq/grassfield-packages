# The serialized publisher of each channel (grassfieldhq/grassfield ADR-0033 h.2 as amended by ADR-0037 g; tools/publish.py).
#
# DISABLED. Nothing is published until the owner decides, after the M5 legal review (CLAUDE.md). The job is `if: false`
# and its first step fails, so it never runs; it reads no secret and writes nowhere. Enabling it is the owner's decision,
# with the host chosen (ADR-0033 O8), the owner's key and the storage credentials set in the protected environments below
# (ADR-0033 g "From the owner, later"), never by an agent.
#
# Its own workflow, so that neither a pull request nor a manual dispatch from another branch ever starts it (catalog.yml
# checks those; ADR-0033 b.7: the key is used by the signing and publishing jobs only, never on a pull_request), and
# every publishing run of a channel, whatever started it, waits in that channel's one concurrency group: a change on
# main, or a release build of ADR-0033 (build.yml: its release job keeps a tag's signed release builds under
# releases/<channel>/ in the bucket, then this workflow starts when the build workflow completes, workflow_run). When it
# is enabled, the job's condition becomes: a push, or a build workflow that succeeded.
# GitHub runs one at a time, never cancels the running one (cancel-in-progress: false) and cancels a waiting run when a
# newer one queues. So a run takes nothing from its trigger and publishes the latest state: the catalog built from
# main's head as it is when the run starts, and the newest release built and signed for the channel; tools/publish.py
# builds the new snapshot from the current one and writes the pointer only if it has not moved.
name: publish

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [build]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    # Created and protected by the owner when publishing is enabled (ADR-0033 b.7): the owner approves each run (required
    # reviewers) and only main may deploy to it; it will hold that channel's key and storage credentials. None exists today.
    environment: publish-${{ matrix.channel }}
    concurrency:
      group: publish-${{ matrix.channel }}
      cancel-in-progress: false
    container:
      image: archlinux:base@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0
    steps:
      - name: Disabled
        run: |
          echo "Publishing is disabled until the owner decides (CLAUDE.md); the bucket's backend waits for the host." >&2
          exit 1

      - name: Tools (a whole upgrade, never -Sy alone; vercmp comes with pacman, bsdtar with libarchive)
        run: pacman -Syu --noconfirm --needed git python gnupg pacman libarchive

      # main's head when this step runs, not the commit that started the run.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Main's head, never another commit
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"

      - name: Build the catalog for the channel
        run: |
          python3 -I tools/catalog.py validate
          python3 -I tools/catalog.py build --channel "${{ matrix.channel }}" --serial "$(date -u +%s)" --out /tmp/catalog

      # Then, once the owner decides: sign /tmp/catalog/grassfield-catalog.v1.json with the owner's key from this
      # environment (catalog.py sign); fetch the channel's release builds, releases/<channel>/ in the bucket (build.yml's
      # release job keeps each tag's there, signed and checked, its database last; a rollback moves withdrawn ones to
      # withdrawn/<channel>/), into /tmp/releases; and run
      #   tools/publish.py --store <the bucket> --channel <channel> --releases /tmp/releases
      #                    --catalog /tmp/catalog --keyring-dir <grassfield-keyring's files>
      # which publishes the newest release build when it is newer than the snapshot's, never an older database, and
      # checks the catalog as the Store does before it publishes anything. The bucket's backend waits for the host.
      # ADR-0033 h.2's deliberate rollback is the owner's, by hand in this concurrency group (scripts/rollback.sh:
      # tools/publish.py --rollback-to).
