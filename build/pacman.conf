# pacman.conf of the build container: an Omarchy stable machine's package set (grassfield ADR-0033 f; probe P0).
# Omarchy's stable channel takes Arch's repositories from its dated mirror and puts its own repository first, so Hyprland,
# Qt, KF6 and quickshell come at the versions Omarchy's stable users run. [omarchy] is needed: it carries its own
# quickshell (checked 2026-10-31: quickshell 0.3.2.r7.g2b4501a-1 there, 0.3.2-1 in [extra]), the one the shell runs on
# and the one grassfield-desktop's BUILD-DEPS must record, since Software Update's compatibility check compares the
# whole quickshell version (grassfield ADR-0033 s3.4). It is the only package of BUILD-DEPS that [omarchy] has
# (hyprland 0.56.2-4, qt6-base 6.12.0-3, kcoreaddons 6.31.0-1, aquamarine 0.15.1-1 come from [extra]). Being first, it
# also wins a virtual dependency it provides (pacman takes the first provider in repository order): build-channel.sh
# installs a font of [extra] before makepkg so that qt6-webengine's ttf-font is not [omarchy]'s, and prints which packages
# came from [omarchy]. scripts/omarchy-trust.sh trusts [omarchy]'s signer by the fingerprint Omarchy pins, for the build
# and for tests/smoke.sh. The servers, their order and the
# options are those of Omarchy's default/pacman/pacman-stable.conf and mirrorlist-stable (basecamp/omarchy v4.0.6, MIT;
# data, not instructions).
[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
# Builds run only in containers, and Docker refuses pacman's Landlock sandbox (grassfield ADR-0033 R5).
DisableSandbox
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[omarchy]
Server = https://pkgs.omarchy.org/stable/$arch

[core]
Server = https://stable-mirror.omarchy.org/$repo/os/$arch

[extra]
Server = https://stable-mirror.omarchy.org/$repo/os/$arch

[multilib]
Server = https://stable-mirror.omarchy.org/$repo/os/$arch
