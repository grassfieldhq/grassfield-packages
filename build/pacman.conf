# pacman.conf of the build container: an Omarchy stable machine's package set (grassfield ADR-0033 f; probe P0).
# Omarchy's stable channel takes Arch's repositories from its dated mirror, so Hyprland, Qt, KF6 and quickshell come at
# the versions Omarchy's stable users run (checked 2026-10-27: hyprland 0.56.2-4, quickshell 0.3.2-1, qt6-webengine
# 6.11.2-2, kio 6.31.0-1, all in [extra] there). Nothing Grassfield builds against comes from [omarchy] itself, which is
# left out. The server and options are those of Omarchy's default/pacman/pacman-stable.conf and mirrorlist-stable
# (basecamp/omarchy v4.0.6, MIT; data, not instructions).
[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
# Builds run only in containers, and Docker refuses pacman's Landlock sandbox (grassfield ADR-0033 R5).
DisableSandbox
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://stable-mirror.omarchy.org/$repo/os/$arch

[extra]
Server = https://stable-mirror.omarchy.org/$repo/os/$arch

[multilib]
Server = https://stable-mirror.omarchy.org/$repo/os/$arch
